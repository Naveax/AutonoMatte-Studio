[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomatte"
version = "0.6.1"
description = "Fully local, autonomous, native-resolution background removal and alpha matting"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [{name = "Naveax"}]
dependencies = [
  "numpy>=1.26,<2.0; python_version < '3.13'",
  "numpy>=2.1; python_version >= '3.13'",
  "Pillow>=11.0",
  "scipy>=1.13",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
rembg-cpu = ["rembg[cpu]>=2.0.67"]
rembg-gpu = ["rembg[gpu]>=2.0.67"]
rembg-dml = ["rembg[cpu]>=2.0.67", "onnxruntime-directml>=1.20"]
rembg-rocm = ["rembg[rocm]>=2.0.67"]
formats = ["pillow-heif>=0.18"]
birefnet = [
  "torch>=2.5",
  "torchvision>=0.20",
  "transformers>=4.49,<6",
  "accelerate>=1.2",
  "safetensors>=0.4",
  "huggingface-hub>0.25",
  "opencv-python>=4.10",
  "timm>=1.0",
  "scikit-image>=0.24",
  "kornia>=0.8",
  "einops>=0.8",
  "tqdm>=4.67",
  "prettytable>=3.12",
]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.9", "httpx>=0.28"]

[project.scripts]
autonomatte = "autonomatte.cli:main"
autonomatte-web = "autonomatte.webapp:main"
autonomatte-media = "autonomatte.media_cli:main"
autonomatte-models = "autonomatte.models_cli:main"
autonomatte-doctor = "autonomatte.doctor:main"
autonomatte-benchmark = "autonomatte.benchmark_cli:main"
autonomatte-calibrate = "autonomatte.calibrate_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autonomatte = ["web/static/*.html", "models/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
