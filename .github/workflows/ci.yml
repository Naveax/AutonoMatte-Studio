name: CI

on:
  push:
  pull_request:

jobs:
  package-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconstruct embedded wheel
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/wheel.part*.b64 | base64 --decode > autonomatte-0.6.1-py3-none-any.whl
          python -m zipfile -t autonomatte-0.6.1-py3-none-any.whl

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install NumPy runtime
        run: python -m pip install --only-binary=:all: 'numpy==1.26.4'

      - name: Install Pillow runtime
        run: python -m pip install --only-binary=:all: 'Pillow==11.3.0'

      - name: Install SciPy runtime
        run: python -m pip install --only-binary=:all: 'scipy==1.16.3'

      - name: Install web runtime
        run: |
          python -m pip install \
            'fastapi>=0.115,<1' \
            'uvicorn[standard]>=0.32,<1' \
            'python-multipart>=0.0.12'

      - name: Install embedded AutonoMatte wheel
        run: python -m pip install --no-deps ./autonomatte-0.6.1-py3-none-any.whl

      - name: Validate dependency graph
        run: python -m pip check

      - name: Smoke test
        run: |
          python -c "import autonomatte; print(autonomatte.__version__)"
          python -m autonomatte.cli --help
